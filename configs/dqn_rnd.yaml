# ============================================================================
# DQN + Random Network Distillation — Config
# Student A (Mohammad)
# ============================================================================

# Sweep grid (bash script loops over these)
sweep:
  seeds: [0, 1, 2, 3, 4]
  learning_rates: [0.0001, 0.0005, 0.001]
  gammas: [0.99, 0.95]
  betas: [0.1, 1.0]
  environments:
    - { name: "cartpole", reward: "dense" }
    - { name: "cartpole", reward: "sparse" }
    - { name: "mountaincar", reward: "dense" }
    - { name: "mountaincar", reward: "sparse" }

# Training hyperparameters (fixed across all sweep runs)
num_episodes: 2000
max_steps: 200
log_every: 50

# DQN-specific
buffer_capacity: 50000
batch_size: 64
warmup_steps: 100
target_update_freq: 500
epsilon_start: 1.0
epsilon_end: 0.01
epsilon_decay_episodes: 1000
updates_per_episode: 4

# RND-specific
predictor_lr: 0.001

# Network architecture
model:
  hidden_dim: 64
