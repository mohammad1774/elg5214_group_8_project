# ============================================================================
# DQN + Entropy Regularization — MountainCar only, longer training
# Student A (Mohammad)
# ============================================================================

sweep:
  seeds: [3]
  learning_rates: [0.001]
  gammas: [0.99]
  alphas: [0.1, 0.2]  # Stronger entropy bonus for better exploration
  environments:
    - { name: "mountaincar", reward: "dense" }
    - { name: "mountaincar", reward: "sparse" }

# Train longer, but keep per-episode horizon at the environment default.
# MountainCar-v0 terminates after 200 env steps per episode.
num_episodes: 8000
max_steps: 200  # MountainCar environment limit
log_every: 100  # More frequent logging to track progress
final_eval_episodes: 100

buffer_capacity: 50000  # Reasonable size for 250 episodes worth of data
batch_size: 128
warmup_steps: 100  # Shorter warmup
target_update_freq: 500
epsilon_start: 1.0
epsilon_end: 0.01
epsilon_decay_episodes: 1000  # CRITICAL: Decay ε faster so exploration phase is early
updates_per_episode: 8  # More gradient steps per episode

model:
  hidden_dim: 64

log_dir: "./logs/dqn_entropy_mc_8000"
results_dir: "results/dqn_entropy_mc_8000"
project_name: "DQN_Entropy_MC8000"
